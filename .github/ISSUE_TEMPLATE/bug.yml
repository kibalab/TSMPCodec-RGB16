name: Bug report
description: Report incorrect behavior with steps and environment details.
labels: ["bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first. Report one independently fixable problem per issue.
        English, Japanese and Korean reports are welcome. Do not include credentials, private stream URLs or personal data from logs.
  - type: textarea
    id: problem
    attributes:
      label: What is wrong?
      description: Describe the component, failure and conditions. Include expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the minimum scene configuration, settings and steps. For a source-review finding, say it has not been reproduced and link the relevant code.
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Where does it happen?
      multiple: true
      options:
        - Unity Editor (edit mode)
        - Unity Editor (play mode)
        - Standalone Player
        - UdonSharp compilation
        - VRChat client
        - Installation or import
        - Source review only (not reproduced)
    validations:
      required: true
  - type: textarea
    id: versions
    attributes:
      label: Versions and configuration
      description: Include TSMP Core and codec versions, Unity, OS, GPU/graphics API if relevant, and Player backend. Enter "not installed" for VRChat SDK/UdonSharp when using ordinary Unity.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs, screenshots or minimal reproduction
      description: Include the first error and its stack trace when available. State which checks were actually run; do not treat C# compilation as UdonSharp or Player validation.
